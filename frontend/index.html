<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f8f5"><title>头像替换</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header class="topbar"><label class="avatar-upload" title="更换头像"><input id="replacement" type="file" accept="image/jpeg,image/png,image/webp" aria-label="更换目标头像"><img id="targetAvatar" class="avatar" src="/api/default-avatar" alt="目标头像"></label></header>
<main>
  <section class="upload-section"><label id="dropzone" class="upload-card"><input id="screenshots" type="file" multiple accept="image/jpeg,image/png,image/webp" aria-label="选择截图"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m3 16 5-5 5 5m-2-2 4-4 6 6"/><circle cx="9" cy="8" r="1"/></svg><span id="uploadTitle">选择截图</span></label><div id="processing" class="processing" role="status" aria-label="正在处理" hidden><span class="spinner"></span></div></section>
  <p id="notice" role="status" aria-live="polite" hidden></p>
  <section id="results" hidden><div class="results-heading"><span id="summary"></span><button id="reset" class="icon-button" aria-label="清空结果" title="清空"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7m4-7v7"/></svg></button></div><div id="cards" class="cards"></div></section>
</main>
<div id="savebar" class="savebar" hidden><button id="saveAll" class="primary">保存全部</button></div>
<dialog id="reviewDialog" aria-label="处理结果"><div class="sheet-header"><span id="detailTitle"></span><button id="closeDetail" class="icon-button" aria-label="关闭">×</button></div><div class="image-viewport" id="imageViewport" tabindex="0" role="img" aria-label="处理后的图片，可缩放"><div id="stage" class="stage"><img id="preview" alt="处理后的图片" draggable="false"></div><span id="previewLoading" class="loading-dot" role="status" aria-label="正在更新" hidden></span></div><div class="sheet-controls"><div class="radius-row"><label for="radius">圆角</label><input id="radius" type="range" min="0" max="40" step="0.1"><output id="radiusValue" for="radius"></output></div><p id="detailNotice" class="detail-notice" role="status" hidden></p><button id="saveCurrent" class="primary">保存</button></div></dialog>
<script type="module" src="/app.js"></script>
</body></html>
